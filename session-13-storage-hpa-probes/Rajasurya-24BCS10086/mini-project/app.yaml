apiVersion: v1
kind: Namespace
metadata:
  name: hw13
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-data
  namespace: hw13
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: hw13
spec:
  replicas: 2
  selector:
    matchLabels: {app: web-app}
  template:
    metadata:
      labels: {app: web-app}
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
          startupProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: web-data}
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: hw13
spec:
  selector: {app: web-app}
  ports: [{port: 80, targetPort: 80}]
