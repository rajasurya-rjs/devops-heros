apiVersion: v1
kind: ServiceAccount
metadata:
  name: capstone-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capstone-prometheus-discovery
  namespace: {{ .Values.applicationNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capstone-prometheus-discovery
  namespace: {{ .Values.applicationNamespace }}
subjects:
  - kind: ServiceAccount
    name: capstone-prometheus
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capstone-prometheus-discovery
