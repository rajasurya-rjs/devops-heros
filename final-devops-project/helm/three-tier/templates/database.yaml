apiVersion: v1
kind: Service
metadata: {name: database}
spec:
  clusterIP: None
  selector: {app: database}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: database}
spec:
  serviceName: database
  replicas: 1
  selector: {matchLabels: {app: database}}
  template:
    metadata: {labels: {app: database}}
    spec:
      securityContext: {runAsUser: 70, runAsGroup: 70, fsGroup: 70}
      containers:
        - name: postgres
          image: {{ .Values.postgresImage }}
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: notes}
            - {name: POSTGRES_DB, value: notes}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: password}
          resources:
            requests: {cpu: 30m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, notes, -d, notes]}
            periodSeconds: 3
          livenessProbe:
            exec: {command: [pg_isready, -U, notes, -d, notes]}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts: [{name: postgres-data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: postgres-data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources: {requests: {storage: {{ .Values.storageSize }}}}
