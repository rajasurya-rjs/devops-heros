apiVersion: v1
kind: ConfigMap
metadata: {name: backend-config}
data:
  APP_TITLE: Operations Notes
  APP_VERSION: three-tier
  PGHOST: database
  PGUSER: notes
  PGDATABASE: notes
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: backend
          image: "{{ .Values.backend.repository }}:{{ .Values.backend.tag }}"
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: backend-config}}]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: password}
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: token}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 300m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /ready, port: 8080}
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
{{- if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: backend}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: backend}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
{{- end }}
