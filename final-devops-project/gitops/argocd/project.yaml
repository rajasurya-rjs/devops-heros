apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: capstone
  namespace: argocd
spec:
  description: Operations Notes homework application on the local recording cluster
  sourceRepos:
    - https://github.com/rajasurya-rjs/devops-heros.git
  destinations:
    - namespace: project-three-tier
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  clusterResourceWhitelist: []
