apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: homework, namespace: hw-gitops}
spec:
  interval: 30s
  url: https://github.com/rajasurya-rjs/devops-heros
  ref: {branch: main}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: notes, namespace: hw-gitops}
spec:
  interval: 30s
  path: ./final-devops-project/gitops/app
  prune: true
  wait: true
  timeout: 120s
  sourceRef: {kind: GitRepository, name: homework}
