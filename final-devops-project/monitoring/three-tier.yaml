apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: final-homework}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: operations-notes
        static_configs:
          - targets: [ops-notes:8080]
      - job_name: operations-notes-three-tier
        static_configs:
          - targets: [backend.project-three-tier.svc.cluster.local:8080]
      - job_name: deliberate-unavailable-target
        static_configs:
          - targets: [127.0.0.1:19999]
  alerts.yml: |
    groups:
      - name: homework
        rules:
          - alert: TargetUnavailable
            expr: up == 0
            for: 10s
            labels:
              severity: warning
            annotations:
              summary: A configured scrape target is unavailable
