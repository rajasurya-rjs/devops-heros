apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: final-homework}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: operations-notes
        static_configs:
          - targets: [ops-notes:8080]
      - job_name: deliberate-unavailable-target
        static_configs:
          - targets: [127.0.0.1:19999]
  alerts.yml: |
    groups:
      - name: homework
        rules:
          - alert: TargetUnavailable
            expr: up == 0
            for: 10s
            labels:
              severity: warning
            annotations:
              summary: A configured scrape target is unavailable
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: final-homework}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2h]
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 30m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: final-homework}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: final-homework}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        uid: homework-prometheus
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: Homework
        folder: Homework
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: final-homework}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          ports: [{containerPort: 3000}]
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            timeoutSeconds: 3
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /api/health, port: 3000}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboard.yaml, subPath: dashboard.yaml}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboard
          configMap: {name: grafana-dashboard}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: final-homework}
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
