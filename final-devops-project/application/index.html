<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operations Notes</title><style>body{font:17px system-ui;margin:5vh auto;max-width:850px;background:#f5f7fa;color:#17324d;padding:24px}header{border-bottom:2px solid #d4dee9;padding-bottom:20px}h1{margin:0}small{color:#4d6782}form{display:flex;gap:10px;margin:25px 0}input{flex:1;padding:14px;border:1px solid #bdcddd;border-radius:6px;font:inherit}button{background:#245c9c;color:white;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}li{background:white;margin:10px 0;padding:18px;border:1px solid #dce4ed;border-radius:6px;display:flex;justify-content:space-between;gap:12px}ul{padding:0;list-style:none}#state{margin-top:18px;color:#286345}</style>
<header><small>DEVOPS LAB · RAJASURYA J · 24BCS10086</small><h1>Operations Notes</h1><p>Track deployment checks and incident fixes.</p><small id="config"></small></header>
<form id="form"><input id="note" maxlength="500" required placeholder="Add a deployment or troubleshooting note"><button>Add note</button></form><ul id="notes"></ul><p id="state" role="status"></p>
<script>
async function api(path,method='GET',body){const response=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}
async function refresh(){const notes=await api('/api/notes');const list=document.querySelector('#notes');list.replaceChildren();for(const note of notes){const li=document.createElement('li');const text=document.createElement('span');text.textContent=note.text;const actions=document.createElement('span');const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=async()=>{const value=prompt('Update note',note.text);if(value){await api('/api/notes/'+note.id,'PUT',{text:value});refresh()}};const remove=document.createElement('button');remove.textContent='Delete';remove.onclick=async()=>{await api('/api/notes/'+note.id,'DELETE');refresh()};actions.append(edit,remove);li.append(text,actions);list.append(li)}document.querySelector('#state').textContent=notes.length+' notes saved'}
document.querySelector('#form').onsubmit=async(event)=>{event.preventDefault();try{await api('/api/notes','POST',{text:document.querySelector('#note').value});document.querySelector('#note').value='';await refresh()}catch(error){document.querySelector('#state').textContent=error.message}};
api('/api/config').then(c=>document.querySelector('#config').textContent=c.title+' · '+c.version+' · Secret injected: '+c.secret_injected);refresh();
</script></html>
