apiVersion: v1
kind: Namespace
metadata: {name: hw14}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: troubleshooting-app, namespace: hw14}
spec:
  replicas: 2
  selector:
    matchLabels: {app: troubleshooting-app}
  template:
    metadata:
      labels: {app: troubleshooting-app}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: troubleshooting-service, namespace: hw14}
spec:
  selector: {app: troubleshooting-app}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: hw14}
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: [sleep, "3600"]
