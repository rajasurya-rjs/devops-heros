{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "config",
    "namespace": "hw14"
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "command": [
          "sleep",
          "3600"
        ],
        "env": [
          {
            "name": "APP_TOKEN",
            "valueFrom": {
              "secretKeyRef": {
                "name": "missing-config-secret",
                "key": "token"
              }
            }
          }
        ]
      }
    ]
  }
}
