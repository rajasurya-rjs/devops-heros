---
# Source: notes-chart/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-config
data:
  APP_NAME: "Rajasurya Operations Notes"
  ENVIRONMENT: "development"
  index.html: |
    <!doctype html><h1>Rajasurya Operations Notes</h1>
    <p>Environment: development | Version: v1</p>
---
# Source: notes-chart/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: notes
spec:
  type: NodePort
  selector: {app: notes}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30095
---
# Source: notes-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
spec:
  replicas: 1
  selector:
    matchLabels: {app: notes}
  template:
    metadata:
      labels: {app: notes}
      annotations:
        checksum/config: 8bbbbf4fbf0eb2f6e1c2cbf44cd35633ba2ac0a9bf718b66c22b3d8a5483e4ba
    spec:
      containers:
        - name: notes
          image: nginx:alpine
          ports: [{containerPort: 80}]
          envFrom:
            - configMapRef: {name: notes-config}
          volumeMounts:
            - {name: html, mountPath: /usr/share/nginx/html}
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: html
          configMap:
            name: notes-config
            items:
              - {key: index.html, path: index.html}
